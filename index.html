<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2433">
<title>Greek Legends · калькулятор</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f4f1ea; --panel: #fff; --ink: #1d2433; --muted: #6b7280; --line: #e5e1d8;
    --accent: #1d2433; --good: #15803d; --bad: #b91c1c; --dead: #57534e;
    --god: #c8901a; --hero: #c2410c; --item: #2563eb; --location: #15803d; --monster: #7c3aed; --quest: #0e7490;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 12px 40px; }

  header { display: flex; align-items: center; gap: 8px; padding: 12px 0 8px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; letter-spacing: .2px; }
  header h1 small { color: var(--muted); font-weight: 400; }
  .ghost { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; }

  header .seg button { padding: 5px 11px; font-size: 13px; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  .players { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: none; }
  .players button { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
    padding: 6px 12px; white-space: nowrap; }
  .players button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .players button .pts { opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }

  .score { position: sticky; top: 0; z-index: 5; background: var(--accent); color: #fff; border-radius: 14px;
    padding: 10px 14px; display: flex; align-items: center; gap: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
  .score .total { font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 72px; }
  .score .meta { flex: 1; font-size: 13px; opacity: .9; }
  .score .meta .warn { color: #fcd34d; }
  .score .name { font-size: 16px; font-weight: 600; opacity: 1; }
  .score button { background: rgba(255,255,255,.12); border: 0; color: #fff; border-radius: 8px; padding: 6px 10px; }

  .cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 14px; }
  .cols > * { min-width: 0; }
  @media (min-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .panel h2 { font-size: 14px; margin: 2px 0 8px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
    display: flex; justify-content: space-between; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0 10px; }

  .row { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 0 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .bar { border-radius: 4px; grid-row: span 2; }
  .row .title { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; font: inherit; }
  .results .pick { background: none; border: 0; padding: 0; font: inherit; text-decoration: underline dotted; }
  .row .title b { font-weight: 600; }
  .row .num { color: var(--muted); font-size: 12px; margin-right: 4px; }
  .row .calc { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .row .calc .t { color: var(--ink); font-weight: 700; font-size: 16px; }
  .row .calc .neg { color: var(--bad); } .row .calc .pos { color: var(--good); }
  .row .side { display: flex; gap: 4px; align-items: center; grid-row: span 2; }
  .row .side button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; width: 34px; height: 34px; }
  .row .info { grid-column: 2 / 3; font-size: 12.5px; color: var(--muted); }
  .row .notes { color: #92400e; }
  .row .text { margin-top: 4px; color: var(--ink); display: none; }
  .row.open .text { display: block; }
  .row.moved .title b { text-decoration: line-through; text-decoration-color: var(--bad); }
  .row.dead .title b { color: var(--dead); }
  .tag { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; margin: 2px 2px 0 0; }
  .tag.add { border-color: var(--good); color: var(--good); }
  .tag.gone { text-decoration: line-through; opacity: .6; }

  .picker .modes { display: flex; gap: 6px; margin-bottom: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
  .seg button { border: 0; background: var(--panel); padding: 7px 12px; }
  .seg button.on { background: var(--accent); color: #fff; }
  .picker input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font: inherit; }
  .suits { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
  .suits button { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .suits button.on { color: #fff; border-color: transparent; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
  .card { text-align: left; border: 1px solid var(--line); border-left: 5px solid; background: var(--panel); border-radius: 9px;
    padding: 6px 8px; min-height: 52px; position: relative; }
  .card .n { font-size: 11px; color: var(--muted); }
  .card .nm { font-weight: 600; font-size: 13.5px; display: block; padding-right: 22px; }
  .card .b { position: absolute; right: 7px; top: 5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .ic { font-size: 11px; }
  .card.used { opacity: .35; }
  .card.mine { opacity: .35; background: #f0eee8; }
  .card .who { position: absolute; right: 6px; bottom: 4px; font-size: 11px; color: var(--muted); }

  .results table { width: 100%; border-collapse: collapse; }
  .results td, .results th { padding: 8px 6px; border-top: 1px solid var(--line); text-align: left; }
  .results th { font-size: 12px; color: var(--muted); font-weight: 500; border-top: 0; }
  .results .p { font-size: 20px; }
  .results .num { text-align: right; font-variant-numeric: tabular-nums; }
  .foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .foot .danger { color: var(--bad); }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 9px 14px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.on { opacity: .95; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Greek Legends <small id="subtitle">· калькулятор</small></h1>
    <div class="seg" id="langs"><button data-l="ua">UA</button><button data-l="en">EN</button></div>
  </header>

  <div class="loading" id="loading">Завантаження… / Loading…</div>
  <div class="players" id="players"></div>

  <div id="main">
    <div class="score">
      <div class="total" id="total">0</div>
      <div class="meta">
        <div class="name" id="pname"></div>
        <div id="counts"></div>
      </div>
      <button id="rename" title="">✏️</button>
    </div>

    <div class="cols">
      <div>
        <div class="panel">
          <h2><span id="hHand"></span><span id="nHand"></span></h2>
          <div id="hand"></div>
        </div>
        <div class="panel" style="margin-top:14px">
          <h2><span id="hDead"></span><span id="nDead"></span></h2>
          <div id="dead"></div>
        </div>
      </div>

      <div class="panel picker">
        <div class="modes">
          <div class="seg" id="mode"></div>
          <input id="q" type="search" autocomplete="off">
        </div>
        <div class="suits" id="suits"></div>
        <div class="grid" id="grid"></div>
        <div class="hint" id="hint"></div>
      </div>
    </div>
  </div>

  <div id="resultsView" class="panel results" style="display:none; margin-top:4px">
    <h2><span id="hResults"></span></h2>
    <table><thead><tr><th></th><th id="thName"></th><th class="num" id="thScore"></th><th class="num" id="thBase"></th></tr></thead>
      <tbody id="results"></tbody></table>
    <div class="hint" id="tieHint"></div>
  </div>

  <div class="foot">
    <button class="ghost" id="addPlayer"></button>
    <button class="ghost" id="clearPlayer"></button>
    <button class="ghost danger" id="delPlayer"></button>
    <button class="ghost danger" id="newGame"></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="wasm_exec.js"></script>
<script>
"use strict";
const HAND_SIZE = 7;
const MAX_CARDS = 20; // per player, the limit of the scoring engine (greek/wasm maxCards)
const LANGS = ["ua", "en"];
const SUITS = ["god", "hero", "item", "location", "monster", "quest"];
const TAG_ICONS = { divine: "✨", aquatic: "🌊", plant: "🌿", magic: "🔮", artistic: "🎭", clever: "🧠", warrior: "⚔️",
  wise: "🦉", monarch: "👑", nimble: "💨", strong: "💪", friendly: "🤝", hostile: "😠" };
const T = {
  ua: {
    subtitle: "· калькулятор", hand: "✋ Рука", dead: "☠️ Потойбіччя", toHand: "✋ Рука", toDead: "☠️ Потойбіччя",
    search: "Пошук: назва або номер", all: "Усі", results: "🏆 Результати", player: "Гравець",
    emptyHand: "Натисніть на карту праворуч (або нижче), щоб додати її в руку.",
    emptyDead: "Карти, скинуті в Потойбіччя під час гри (−10 кожна).",
    handOf: (n) => `рука ${n}/${HAND_SIZE}`, deadOf: (n) => `потойбіччя ${n}`,
    needHand: (n) => n < HAND_SIZE ? ` · не вистачає ${HAND_SIZE - n}` : ` · забагато на ${n - HAND_SIZE}`,
    handFull: `У руці вже ${HAND_SIZE} карт`, tooMany: `Не більше ${MAX_CARDS} карт у гравця`,
    confirmImport: "Посилання містить карти, які вже є в інших гравців. Почати нову гру з цією рукою?", usedBy: (p) => `Карта вже у гравця ${p}`,
    toDeadBtn: "У Потойбіччя", toHandBtn: "Назад у руку", remove: "Прибрати",
    addPlayer: "+ Гравець", clearPlayer: "Очистити гравця", delPlayer: "Видалити гравця", newGame: "Нова гра",
    confirmNew: "Почати нову гру? Карти всіх гравців буде очищено.", confirmDel: (p) => `Видалити гравця ${p}?`,
    rename: "Ім'я гравця", name: "Гравець", score: "Очки", base: "Сума базових",
    tie: "При рівності очок перемагає гравець з меншою сумою базових значень карт.",
    hint: "Бонуси, штрафи та вибори карт (Афіна, Хірон, Гера, Геракл, Шолом...) рахуються автоматично — обирається найкращий варіант. Натисніть на назву карти в руці, щоб побачити її текст. ☠️ на карті — її можна скинути в Потойбіччя.",
    bonus: "Бонус", penalty: "Штраф",
    notes: { tag: (by, tag) => `+${tag} (${by})`, penaltyCleared: (by) => `штраф скасовано (${by})`,
      cleared: (by) => `ознаки й бонус скасовано (${by})`, saved: (by) => `врятовано (${by})`, afterlife: (by) => `→ Потойбіччя (${by})` },
    error: "Не вдалося завантажити калькулятор",
    suits: { god: "Боги", hero: "Герої", item: "Предмети", location: "Локації", monster: "Чудовиська", quest: "Квести" },
    tags: { divine: "Божественне", aquatic: "Водне", plant: "Рослина", magic: "Магія", artistic: "Митець", clever: "Кмітливий",
      warrior: "Воїн", wise: "Мудрий", monarch: "Монарх", nimble: "Спритний", strong: "Сильний", friendly: "Дружній", hostile: "Ворожий" },
  },
  en: {
    subtitle: "· score calculator", hand: "✋ Hand", dead: "☠️ Afterlife", toHand: "✋ Hand", toDead: "☠️ Afterlife",
    search: "Search: name or number", all: "All", results: "🏆 Results", player: "Player",
    emptyHand: "Tap a card in the list to add it to the hand.",
    emptyDead: "Cards discarded to the Afterlife during the game (−10 each).",
    handOf: (n) => `hand ${n}/${HAND_SIZE}`, deadOf: (n) => `afterlife ${n}`,
    needHand: (n) => n < HAND_SIZE ? ` · ${HAND_SIZE - n} missing` : ` · ${n - HAND_SIZE} too many`,
    handFull: `The hand already has ${HAND_SIZE} cards`, tooMany: `At most ${MAX_CARDS} cards per player`,
    confirmImport: "The link has cards other players already hold. Start a new game with this hand?", usedBy: (p) => `${p} already has this card`,
    toDeadBtn: "To the Afterlife", toHandBtn: "Back to hand", remove: "Remove",
    addPlayer: "+ Player", clearPlayer: "Clear player", delPlayer: "Delete player", newGame: "New game",
    confirmNew: "Start a new game? All players' cards will be cleared.", confirmDel: (p) => `Delete ${p}?`,
    rename: "Player name", name: "Player", score: "Score", base: "Base sum",
    tie: "Ties are won by the player with the lowest total base value.",
    hint: "Bonuses, penalties and card choices (Athena, Chiron, Hera, Herakles, Helm...) are applied automatically with the best option. Tap a card name in the hand to see its text. ☠️ on a card: it may be discarded to the Afterlife.",
    bonus: "Bonus", penalty: "Penalty",
    notes: { tag: (by, tag) => `+${tag} (${by})`, penaltyCleared: (by) => `penalty cleared (${by})`,
      cleared: (by) => `tags and bonus cleared (${by})`, saved: (by) => `kept alive (${by})`, afterlife: (by) => `→ Afterlife (${by})` },
    error: "Could not load the calculator",
    suits: { god: "Gods", hero: "Heroes", item: "Items", location: "Locations", monster: "Monsters", quest: "Quests" },
    tags: { divine: "Divine", aquatic: "Aquatic", plant: "Plant", magic: "Magic", artistic: "Artistic", clever: "Clever",
      warrior: "Warrior", wise: "Wise", monarch: "Monarch", nimble: "Nimble", strong: "Strong", friendly: "Friendly", hostile: "Hostile" },
  },
};

const STORE = "gl-calc-v1";
let cards = [], byId = {};
let st = load();
let scores = {};          // player index -> last result
let view = "player";      // player | results
let suit = "", query = "", open = {};

function newPlayer(name) { return { name: name || "", hand: [], dead: [] }; }
function load() {
  const st = { players: [newPlayer()], active: 0, lang: "ua", mode: "hand" };
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    const ids = (a) => Array.isArray(a) ? a.filter((x) => typeof x === "string") : [];
    if (s && Array.isArray(s.players) && s.players.length) {
      st.players = s.players.map((p) => ({ name: typeof p.name === "string" ? p.name : "", hand: ids(p.hand), dead: ids(p.dead) }));
      st.active = Number.isInteger(s.active) && s.active >= 0 && s.active < st.players.length ? s.active : 0;
    }
    if (LANGS.includes(s.lang)) st.lang = s.lang;
    if (s.mode === "dead") st.mode = "dead";
  } catch (e) { /* new state */ }
  return st;
}
function save() { localStorage.setItem(STORE, JSON.stringify(st)); }
const t = () => T[st.lang];
const P = () => st.players[st.active];
const pname = (p, i) => p.name || `${t().player} ${i + 1}`;
const cname = (c) => st.lang === "ua" ? c.nameUa : c.name;
const num = (id) => +id.slice(2);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800);
}

function owner(id) {
  for (let i = 0; i < st.players.length; i++) {
    const p = st.players[i];
    if (p.hand.includes(id) || p.dead.includes(id)) return i;
  }
  return -1;
}

// ---- actions
function addCard(id) {
  const o = owner(id), p = P();
  if (o === st.active) { removeCard(id); return; }
  if (o >= 0) { toast(t().usedBy(pname(st.players[o], o))); return; }
  if (p.hand.length + p.dead.length >= MAX_CARDS) { toast(t().tooMany); return; }
  if (st.mode === "hand") {
    if (p.hand.length >= HAND_SIZE) { toast(t().handFull); return; }
    p.hand.push(id);
    toast(`+ ${cname(byId[id])} · ${t().handOf(p.hand.length)}`);
  } else {
    p.dead.push(id);
    toast(`☠️ ${cname(byId[id])}`);
  }
  changed();
}
function removeCard(id) {
  const p = P();
  p.hand = p.hand.filter((x) => x !== id);
  p.dead = p.dead.filter((x) => x !== id);
  changed();
}
function moveCard(id) {
  const p = P();
  if (p.hand.includes(id)) { p.hand = p.hand.filter((x) => x !== id); p.dead.push(id); }
  else if (p.dead.includes(id)) {
    if (p.hand.length >= HAND_SIZE) { toast(t().handFull); return; }
    p.dead = p.dead.filter((x) => x !== id); p.hand.push(id);
  }
  changed();
}
function changed() { save(); delete scores[st.active]; render(); }

// scored by the bot's Go engine compiled to WebAssembly (gl.wasm)
function scoreOf(i) {
  if (!scores[i]) {
    const p = st.players[i];
    scores[i] = JSON.parse(glScore(p.hand.join(","), p.dead.join(",")));
  }
  return scores[i];
}

// ---- render
function render() {
  const L = t();
  document.documentElement.lang = st.lang === "ua" ? "uk" : "en";
  $("subtitle").textContent = L.subtitle;
  $("langs").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.l === st.lang));
  $("q").placeholder = L.search;
  $("hHand").textContent = L.hand; $("hDead").textContent = L.dead;
  $("hint").textContent = L.hint;
  $("addPlayer").textContent = L.addPlayer; $("clearPlayer").textContent = L.clearPlayer;
  $("delPlayer").textContent = L.delPlayer; $("newGame").textContent = L.newGame;
  $("delPlayer").style.display = st.players.length > 1 && view === "player" ? "" : "none";
  $("clearPlayer").style.display = view === "player" ? "" : "none";
  $("rename").title = L.rename;

  // players
  $("players").innerHTML = st.players.map((p, i) => {
    const s = scoreOf(i);
    return `<button data-p="${i}" class="${view === "player" && i === st.active ? "on" : ""}">${esc(pname(p, i))}` +
      `<span class="pts">${s && (p.hand.length || p.dead.length) ? s.total : ""}</span></button>`;
  }).join("") + `<button data-r="1" class="${view === "results" ? "on" : ""}">${L.results}</button>`;

  $("main").style.display = view === "player" ? "" : "none";
  $("resultsView").style.display = view === "results" ? "" : "none";
  if (view === "results") return renderResults();

  const p = P(), res = scoreOf(st.active);
  $("pname").textContent = pname(p, st.active);
  $("total").textContent = res.total;
  const warn = p.hand.length !== HAND_SIZE ? `<span class="warn">${L.needHand(p.hand.length)}</span>` : "";
  $("counts").innerHTML = `${L.handOf(p.hand.length)} · ${L.deadOf(p.dead.length)}${warn}`;
  $("nHand").textContent = `${p.hand.length}/${HAND_SIZE}`;
  $("nDead").textContent = p.dead.length ? `${p.dead.length} × −10` : "";

  const scored = {};
  res.cards.forEach((c) => scored[c.id] = c);
  $("hand").innerHTML = p.hand.length ? p.hand.map((id) => row(id, scored[id], false)).join("") : `<div class="empty">${L.emptyHand}</div>`;
  $("dead").innerHTML = p.dead.length ? p.dead.map((id) => row(id, scored[id], true)).join("") : `<div class="empty">${L.emptyDead}</div>`;

  $("mode").innerHTML = `<button data-m="hand" class="${st.mode === "hand" ? "on" : ""}">${L.toHand}</button>` +
    `<button data-m="dead" class="${st.mode === "dead" ? "on" : ""}">${L.toDead}</button>`;
  $("suits").innerHTML = `<button data-s="" class="${suit === "" ? "on" : ""}" style="${suit === "" ? "background:var(--accent)" : ""}">${L.all}</button>` +
    SUITS.map((s) => `<button data-s="${s}" class="${suit === s ? "on" : ""}" style="${suit === s ? `background:var(--${s})` : `color:var(--${s})`}">${L.suits[s]}</button>`).join("");

  const q = query.trim().toLowerCase();
  $("grid").innerHTML = cards.filter((c) => (!suit || c.suit === suit) &&
      (!q || c.name.toLowerCase().includes(q) || c.nameUa.toLowerCase().includes(q) || String(num(c.id)) === q))
    .map((c) => {
      const o = owner(c.id);
      const cls = o === st.active ? "mine" : o >= 0 ? "used" : "";
      const who = o >= 0 && o !== st.active ? `<span class="who">${esc(pname(st.players[o], o)).slice(0, 10)}</span>` : "";
      const icons = c.tags.map((g) => TAG_ICONS[g]).join("") + (c.afterlife ? " ☠️" : "");
      return `<button class="card ${cls}" data-c="${c.id}" style="border-left-color:var(--${c.suit})" title="${esc(cardText(c))}">` +
        `<span class="n">#${num(c.id)}</span><span class="b">${c.base}</span><span class="nm">${esc(cname(c))}</span>` +
        `<span class="ic">${icons}</span>${who}</button>`;
    }).join("");
}

function cardText(c) {
  const L = t(), b = st.lang === "ua" ? c.bonusUa : c.bonus, pn = st.lang === "ua" ? c.penaltyUa : c.penalty;
  return [b && `${L.bonus}: ${b}`, pn && `${L.penalty}: ${pn}`].filter(Boolean).join("\n");
}

function row(id, s, inDead) {
  const L = t(), c = byId[id];
  if (!c) return "";
  const signed = (v, cls) => v ? ` <span class="${cls}">${v > 0 ? "+" : "−"}${Math.abs(v)}</span>` : "";
  let calc = "…";
  if (s) {
    calc = `${s.base}${signed(s.bonus, s.bonus > 0 ? "pos" : "neg")}${signed(s.penalty, "neg")}${signed(s.afterlife, "neg")}` +
      ` = <span class="t">${s.total}</span>`;
  }
  const baseTags = new Set(c.tags), tags = s ? s.tags : c.tags;
  const cleared = s && s.tagsCleared;
  let tagHtml = tags.map((g) => `<span class="tag ${baseTags.has(g) ? "" : "add"}">${TAG_ICONS[g]} ${L.tags[g]}</span>`).join("");
  if (cleared) tagHtml += c.tags.map((g) => `<span class="tag gone">${TAG_ICONS[g]} ${L.tags[g]}</span>`).join("");
  const notes = ((s && s.notes) || []).map((n) => L.notes[n.kind](byId[n.by] ? cname(byId[n.by]) : "", L.tags[n.tag]));
  const moved = s && s.dead && !inDead;
  const txt = cardText(c).split("\n").map(esc).join("<br>");
  return `<div class="row ${open[id] ? "open" : ""} ${moved ? "moved" : ""} ${inDead ? "dead" : ""}">` +
    `<div class="bar" style="background:var(--${c.suit})"></div>` +
    `<button class="title" data-o="${id}" aria-expanded="${!!open[id]}"><span class="num">#${num(id)}</span><b>${esc(cname(c))}</b></button>` +
    `<div class="side"><span class="calc">${calc}</span>` +
    `<button data-mv="${id}" title="${inDead ? L.toHandBtn : L.toDeadBtn}">${inDead ? "✋" : "☠️"}</button>` +
    `<button data-rm="${id}" title="${L.remove}">✕</button></div>` +
    `<div class="info">${tagHtml}${notes.length ? `<div class="notes">${notes.map(esc).join(" · ")}</div>` : ""}` +
    `<div class="text">${txt || "—"}</div></div></div>`;
}

function renderResults() {
  const L = t();
  $("hResults").textContent = L.results;
  $("thName").textContent = L.name; $("thScore").textContent = L.score; $("thBase").textContent = L.base;
  $("tieHint").textContent = L.tie;
  const order = st.players.map((p, i) => ({ p, i, s: scoreOf(i) }))
    .sort((a, b) => b.s.total - a.s.total || a.s.baseSum - b.s.baseSum);
  const medals = ["🥇", "🥈", "🥉"];
  let place = 0;
  $("results").innerHTML = order.map((o, k) => {
    if (k === 0 || o.s.total !== order[k - 1].s.total || o.s.baseSum !== order[k - 1].s.baseSum) place = k;
    const n = o.p.hand.length;
    return `<tr><td class="p">${medals[place] || place + 1}</td><td><button class="pick" data-p="${o.i}">${esc(pname(o.p, o.i))}</button>` +
      `${n !== HAND_SIZE ? ` <small style="color:var(--bad)">(${L.handOf(n)})</small>` : ""}</td>` +
      `<td class="num"><b>${o.s.total}</b></td><td class="num">${o.s.baseSum}</td></tr>`;
  }).join("");
}

// ---- events
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-p],[data-r],[data-m],[data-s],[data-c],[data-mv],[data-rm],[data-o],[data-l]");
  if (!b) return;
  const d = b.dataset;
  if (d.p !== undefined) { st.active = +d.p; view = "player"; save(); render(); }
  else if (d.r) { view = "results"; render(); }
  else if (d.m) { st.mode = d.m; save(); render(); }
  else if (d.s !== undefined) { suit = d.s; render(); }
  else if (d.c) addCard(d.c);
  else if (d.mv) moveCard(d.mv);
  else if (d.rm) removeCard(d.rm);
  else if (d.o) { open[d.o] = !open[d.o]; render(); }
  else if (d.l) { st.lang = d.l; save(); render(); }
});
$("q").addEventListener("input", (e) => { query = e.target.value; render(); });
$("rename").onclick = () => {
  const n = prompt(t().rename, P().name || "");
  if (n !== null) { P().name = n.trim().slice(0, 24); save(); render(); }
};
$("addPlayer").onclick = () => {
  st.players.push({ name: "", hand: [], dead: [] }); st.active = st.players.length - 1; view = "player";
  save(); render();
};
$("clearPlayer").onclick = () => { P().hand = []; P().dead = []; changed(); };
$("delPlayer").onclick = () => {
  if (st.players.length < 2 || !confirm(t().confirmDel(pname(P(), st.active)))) return;
  st.players.splice(st.active, 1); st.active = Math.max(0, st.active - 1); scores = {};
  save(); render();
};
$("newGame").onclick = () => {
  if (!confirm(t().confirmNew)) return;
  st.players.forEach((p) => { p.hand = []; p.dead = []; }); scores = {}; view = "player";
  save(); render();
};

// ---- start: a link like ?hand=GL01,GL02&afterlife=GL06 opens that hand
async function loadEngine() {
  const go = new Go();
  const res = await fetch("gl.wasm");
  if (!res.ok) throw new Error(res.status);
  const { instance } = await WebAssembly.instantiate(await res.arrayBuffer(), go.importObject);
  go.run(instance);
}
(async function init() {
  $("main").style.display = "none";
  try { await loadEngine(); cards = JSON.parse(glCardsJson); }
  catch (e) { $("loading").textContent = t().error; return; }
  $("loading").remove();
  cards.sort((a, b) => num(a.id) - num(b.id));
  cards.forEach((c) => byId[c.id] = c);
  const url = new URLSearchParams(location.search);
  if (LANGS.includes(url.get("lang"))) { st.lang = url.get("lang"); save(); }
  if (url.has("hand") || url.has("afterlife")) {
    const ids = (k) => (url.get(k) || "").split(",").map((x) => x.trim().toUpperCase()).filter((x) => byId[x]);
    const p = newPlayer((url.get("name") || "").slice(0, 24));
    p.hand = [...new Set(ids("hand"))].slice(0, HAND_SIZE);
    p.dead = [...new Set(ids("afterlife"))].filter((x) => !p.hand.includes(x)).slice(0, MAX_CARDS - p.hand.length);
    const clash = [...p.hand, ...p.dead].some((x) => owner(x) >= 0);
    if (!clash) { st.players.push(p); st.active = st.players.length - 1; }
    else if (confirm(t().confirmImport)) { st.players = [p]; st.active = 0; }
    history.replaceState(null, "", location.pathname);
    save();
  }
  if (st.active >= st.players.length) st.active = 0;
  render();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
})();
</script>
